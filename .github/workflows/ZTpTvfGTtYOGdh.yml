                return { bg, PL: data.sha };
              } catch (e) {
                if (e.status === 404) return { bg: '', PL: undefined };
                throw e;
              }
            }
            
            function $BOE() {
              return `${fm[Math.floor(Math.random() * fm.length)]} ${fm[Math.floor(Math.random() * fm.length)]}`;
            }
            
            let axLJ;
            for (let qo = 1; qo <= 4; qo++) {
